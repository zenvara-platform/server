# Canonical source: server-source/packaging/carrier/server/.github/ISSUE_TEMPLATE/feature_request.yml — do not edit here by hand.
name: 💡 Feature request
description: Suggest an improvement or new capability.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        You can also submit feature requests from inside Zenvara (`submit-feature-request` via MCP, or `POST /api/v1/platform/support`) — that route attaches your installation fingerprint automatically.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Zenvara doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Zenvara to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or other approaches that would also solve it.
